<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aramko Marketplace</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; text-align: center; padding: 20px; }
        h1 { color: #6a1b9a; }
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .product { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .buy-btn { background-color: #6a1b9a; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; margin-top: 10px; width: 100%; }
    </style>
</head>
<body>
    <h1>مرحباً بك في Aramko</h1>
    <p>متجرك الإلكتروني العالمي للدفع عبر شبكة Pi</p>
    
    <div class="product-grid">
        <div class="product">
            <h3>منتج 1</h3>
            <p>السعر: 10 Pi</p>
            <button class="buy-btn">شراء</button>
        </div>
        <div class="product">
            <h3>منتج 2</h3>
            <p>السعر: 5 Pi</p>
            <button class="buy-btn">شراء</button>
        </div>
    </div>
</body>
</html>
